spring:
  application:
    name: order-and-cart-management
  profiles:
    active: local
  eureka:
    instance:
      prefer-ip-address: true
      hostname: localhost
      ip-address: 127.0.0.1
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/

server:
  port: 8084

