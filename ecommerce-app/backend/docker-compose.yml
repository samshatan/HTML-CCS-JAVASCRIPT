services:

  ####################################################
  ######### product specific services starts #########
  ####################################################
  product-service:
    build:
      context: ./training
      dockerfile: Dockerfile
    image: samshatan/product-service
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/practiceProductdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: samko.1209
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      - product-db
      - service-discovery
    networks:
      - training-network
  
  product-db:
    image: postgres:16-alpine
    container_name: product-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: samko.1209
      POSTGRES_DB: practiceProductdb
    ports:
      - "5440:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    networks:
      - training-network

  ####################################################
  ########## product specific services ends ##########
  ####################################################

  ####################################################
  ########## user specific services starts ###########
  ####################################################

  user-authentication-service:
    build:
      context: ./user-authenthication
      dockerfile: Dockerfile
    image: samshatan/user-authentication-service
    container_name: user-authentication-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-authentication-db:5432/practiceUserAuthdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: samko.1209
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      - user-authentication-db
      - service-discovery
    networks:
      - training-network

  user-authentication-db:
    image: postgres:16-alpine
    container_name: user-authentication-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: samko.1209
      POSTGRES_DB: practiceUserAuthdb
    ports:
      - "5441:5432"
    volumes:
      - user-authentication-db-data:/var/lib/postgresql/data
    networks:
      - training-network

  ####################################################
  ########### user specific services ends ###########
  ####################################################

  ####################################################
  ####### order and cart specific services starts ####
  ####################################################

  order-and-cart-management-service:
    build:
      context: ./order-and-cart-management
      dockerfile: Dockerfile
    image: samshatan/order-and-cart-management-service
    container_name: order-and-cart-management-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-and-cart-management-db:5432/cartandorderdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: samko.1209
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      - order-and-cart-management-db
      - service-discovery
    networks:
      - training-network

  order-and-cart-management-db:
    image: postgres:16-alpine
    container_name: order-and-cart-management-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: samko.1209
      POSTGRES_DB: cartandorderdb
    ports:
      - "5442:5432"
    volumes:
      - order-and-cart-management-db-data:/var/lib/postgresql/data
    networks:
      - training-network
    
  ####################################################
  ####### order and cart specific services ends #####
  ####################################################

  ####################################################
  ############# service discovery starts #############
  ####################################################

  service-discovery:
    build:
      context: ./service-discovery
      dockerfile: Dockerfile
    image: samshatan/service-discovery
    container_name: service-discovery
    ports:
      - "8761:8761"
    networks:
      - training-network

  ####################################################
  ############## service discovery ends ##############
  ####################################################

  ####################################################
  ############# api gateway starts ###################
  ####################################################

  api-gateway:
    build:
      context: ./apigateway
      dockerfile: Dockerfile
    image: samshatan/api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      - service-discovery
    networks:
      - training-network
    
  ####################################################
  ############# api gateway ends #####################
  ####################################################

volumes:
  product-db-data:
  user-authentication-db-data:
  order-and-cart-management-db-data:

networks:
  training-network:
    driver: bridge